name: CI

# Porte de qualité sur toute proposition de fusion : rien n'entre dans develop
# ou main sans que le lint, les types, les tests, le build et l'audit des
# dépendances soient verts.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          # La version vient de .nvmrc, qui fait foi pour tout le monde : la
          # machine du développeur et l'intégration lisent le même fichier.
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        # L'audit des dépendances a son propre travail plus bas, avec un seuil
        # explicite. L'audit implicite de npm install ne ferait que bruiter ici.
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm run test

      - name: Build de production
        run: npm run build

      - name: Contrôle du poids initial
        # Le produit vise le mobile sur réseaux contraints. On mesure ce que le
        # visiteur télécharge à la première visite, c'est-à-dire le point
        # d'entrée référencé par index.html, et non les chunks différés comme
        # la cartographie, qui ne partent que sur les écrans concernés.
        run: |
          LIMITE_KO=400
          ENTREE=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          if [ -z "$ENTREE" ]; then
            echo "::error::Point d'entrée introuvable dans dist/index.html."
            exit 1
          fi
          POIDS_KO=$(( $(stat -c%s "dist/$ENTREE") / 1024 ))
          echo "Point d'entrée : $ENTREE"
          echo "Poids : ${POIDS_KO} Ko (plafond ${LIMITE_KO} Ko)"
          if [ "$POIDS_KO" -gt "$LIMITE_KO" ]; then
            echo "::error::Le point d'entrée dépasse le plafond fixé."
            exit 1
          fi

  dependances:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Unicité du fichier de verrou
        # Deux verrous concurrents, c'est deux arbres de dépendances possibles
        # pour le même dépôt, donc un audit qui ne prouve rien. Le projet
        # installe avec npm ci : package-lock.json fait foi, seul.
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json est absent alors que l'installation se fait avec npm ci."
            exit 1
          fi
          for verrou in bun.lockb bun.lock yarn.lock pnpm-lock.yaml; do
            if [ -f "$verrou" ]; then
              echo "::error::$verrou coexiste avec package-lock.json. Un seul gestionnaire, un seul verrou."
              exit 1
            fi
          done
          echo "Verrou unique : package-lock.json."

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci --no-audit --no-fund

      - name: Vulnérabilités des dépendances d'exécution
        # Bloquant. Ce qui est listé ici part dans le navigateur du visiteur.
        # Les tolérances éventuelles sont déclarées et datées dans
        # .github/dependency-audit-exceptions.json, jamais passées sous silence.
        run: node .github/scripts/audit-dependencies.mjs

      - name: Vulnérabilités de l'outillage de développement
        # Informatif. Un défaut dans un outil de compilation ne part jamais chez
        # le visiteur : il est signalé, il ne bloque pas la fusion.
        continue-on-error: true
        run: npm audit --audit-level=high

  edge-functions:
    name: Fonctions edge Deno
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Vérification statique des fonctions
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "Vérification de $f"
            deno check "$f"
          done

      - name: Vérification statique des tests d'intégration
        run: deno check supabase/functions/_tests/*.ts

      - name: Tests unitaires des fonctions
        # Toutes les suites sans réseau, et non plus une seule : sept
        # d'entre elles n'étaient jamais exécutées, dont celles qui éprouvent
        # la validation des fiches partenaires, l'échappement HTML, la
        # comparaison en temps constant et la limitation de débit.
        run: |
          deno test --allow-none \
            supabase/functions/_shared/ \
            supabase/functions/moderate-place/validate_test.ts \
            supabase/functions/register-partner/validate_test.ts \
            supabase/functions/submit-lead/lead_test.ts

      - name: Tests d'intégration des protections
        # Ces tests prouvent contre une vraie base que l'auto-validation shopper
        # et l'écriture des montants sont bien refusées. Sans les secrets, ils
        # s'ignorent d'eux-mêmes plutôt que d'échouer.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          deno test --allow-net --allow-env \
            supabase/functions/_tests/ \
            supabase/functions/moderate-place/rls_integration_test.ts \
            supabase/functions/moderate-place/rls_partner_isolation_test.ts

  moteur-argent:
    name: Recettes du moteur d'argent
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci --no-audit --no-fund

      # Ces recettes rejouent le parcours complet d'une course, les gardes
      # d'argent et de preuve, les comptes entreprises, et comparent le devis de
      # l'écran à celui du serveur sur seize mille combinaisons. Elles
      # travaillent dans une transaction annulée : la base ressort intacte.
      #
      # Elles n'étaient jouées par personne : trois d'entre elles lisaient les
      # identifiants par un chemin absolu Windows, donc ne pouvaient tourner que
      # sur un seul poste. Sans secrets, chacune s'ignore et le dit.
      - name: Parcours complet d'une course
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-parcours.mjs

      - name: Gardes d'argent et de preuve
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-gardes.mjs

      - name: Comptes entreprises
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-organisations.mjs

      - name: Parité du devis, écran contre serveur
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/parite-devis.mjs

      # Cinq recettes ecrites depuis n'etaient jouees par personne. Une recette
      # que seul son auteur lance ne protege personne : elle dort jusqu'au jour
      # ou l'on decouvre, en production, ce qu'elle aurait refuse.

      - name: Verification d'identite du shopper
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-identite.mjs

      - name: Matrice de droits d'acces
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-droits.mjs

      - name: Routage des notifications
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-canaux.mjs

      - name: Avis aux etablissements
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-avis-partenaires.mjs

      - name: Codes promotionnels
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-promo.mjs

      - name: Financement des achats
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-financement.mjs

      - name: Demandes de reservation
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-demandes-reservation.mjs

      - name: Cloisonnement client, shopper et console
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-cloisonnement.mjs

      - name: Porteur WhatsApp
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-whatsapp.mjs

      - name: Modes de course administrables
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-modes-de-course.mjs

      - name: Portage WhatsApp confirme par Twilio
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-portage-confirme.mjs

      - name: Paiement au comptoir
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-paiement-comptoir.mjs

      - name: Demandes traitees par l'etablissement
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-demandes-partenaires.mjs

      - name: Gouvernance des acces
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-gouvernance-acces.mjs

      - name: Majoration exceptionnelle
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-majoration.mjs

      - name: Immuabilite d'un retrait
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-retraits-immuables.mjs

      - name: Suspension d'un compte
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-suspension-compte.mjs

      - name: Droits vivants
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-droits-vivants.mjs

      - name: Portee par ville
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-portee-par-ville.mjs

      - name: Portes de la matrice
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/recette-portes-de-la-matrice.mjs

      - name: Audit de securite de la base
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/audit-securite-base.mjs --strict
