# Intégration continue GitLab.
#
# Port fidèle de .github/workflows/ci.yml : mêmes portes, mêmes seuils, même
# tolérance en l'absence de secrets. Le dépôt étant en miroir sur deux
# plateformes, une chaîne plus permissive d'un côté ferait entrer par GitLab ce
# que GitHub refuse, et le miroir cesserait d'être un miroir.
#
# Deux ajouts par rapport à GitHub, l'un et l'autre comblant un manque constaté :
#
#   1. Cinq recettes écrites récemment n'étaient jouées par personne. Elles
#      éprouvent la vérification d'identité du shopper, la matrice de droits, le
#      routage des notifications, les avis aux établissements et les codes
#      promotionnels. Une recette que seul son auteur lance ne protège personne.
#
#   2. Une porte linguistique. Les règles du projet interdisent le tiret
#      cadratin, le tiret demi-cadratin et les emojis dans le code ; rien ne le
#      vérifiait, et une règle qu'aucune machine ne contrôle finit par céder.

default:
  image: node:22.12.0
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull

variables:
  # npm ci lit ce cache : sans lui, chaque travail réinstalle tout l'arbre.
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  GIT_DEPTH: "0"

stages:
  - installation
  - qualite
  - securite
  - recettes

# Les mêmes déclencheurs que sur GitHub : toute proposition de fusion vers
# develop ou main, et chaque poussée sur develop.
.declencheurs: &declencheurs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Installation, une fois, partagée par tous les travaux suivants
# ---------------------------------------------------------------------------

installation:
  stage: installation
  <<: *declencheurs
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  script:
    # L'audit des dépendances a son propre travail, avec un seuil explicite.
    # L'audit implicite de npm install ne ferait que bruiter ici.
    - npm ci --no-audit --no-fund
  artifacts:
    expire_in: 1 hour
    paths:
      - node_modules/

# ---------------------------------------------------------------------------
# Qualité
# ---------------------------------------------------------------------------

lint:
  stage: qualite
  <<: *declencheurs
  needs: [installation]
  script:
    - npm run lint

types:
  stage: qualite
  <<: *declencheurs
  needs: [installation]
  script:
    - npm run typecheck

tests:
  stage: qualite
  <<: *declencheurs
  needs: [installation]
  script:
    - npm run test

build:
  stage: qualite
  <<: *declencheurs
  needs: [installation]
  script:
    - npm run build
    # Le produit vise le mobile sur réseaux contraints. On mesure ce que le
    # visiteur télécharge à la première visite, c'est-à-dire le point d'entrée
    # référencé par index.html, et non les fragments différés comme la
    # cartographie, qui ne partent que sur les écrans concernés.
    - |
      LIMITE_KO=400
      ENTREE=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
      if [ -z "$ENTREE" ]; then
        echo "Point d'entrée introuvable dans dist/index.html."
        exit 1
      fi
      POIDS_KO=$(( $(stat -c%s "dist/$ENTREE") / 1024 ))
      echo "Point d'entrée : $ENTREE"
      echo "Poids : ${POIDS_KO} Ko (plafond ${LIMITE_KO} Ko)"
      if [ "$POIDS_KO" -gt "$LIMITE_KO" ]; then
        echo "Le point d'entrée dépasse le plafond fixé."
        exit 1
      fi
  artifacts:
    expire_in: 1 day
    paths:
      - dist/

typographie:
  stage: qualite
  <<: *declencheurs
  needs: []
  script:
    # Le tiret cadratin et le tiret demi-cadratin sont proscrits par les règles
    # du projet, de même que les emojis dans le code. Aucune machine ne le
    # vérifiait : une règle qu'on ne contrôle pas finit par céder, et le
    # rattrapage coûte alors bien plus qu'un refus au bon moment.
    - |
      FAUTIFS=$(grep -rlP '[\x{2014}\x{2013}]' \
        --include='*.ts' --include='*.tsx' --include='*.sql' \
        --include='*.md' --include='*.mjs' --include='*.yml' \
        src/ supabase/ scripts/ docs/ 2>/dev/null || true)
      if [ -n "$FAUTIFS" ]; then
        echo "Tiret cadratin ou demi-cadratin trouvé dans :"
        echo "$FAUTIFS"
        echo "Remplacez-le par une virgule, un deux-points, des parenthèses ou deux phrases."
        exit 1
      fi
      echo "Aucun tiret cadratin ni demi-cadratin."

# ---------------------------------------------------------------------------
# Sécurité et dépendances
# ---------------------------------------------------------------------------

verrou-unique:
  stage: securite
  <<: *declencheurs
  needs: []
  script:
    # Deux verrous concurrents, c'est deux arbres de dépendances possibles pour
    # le même dépôt, donc un audit qui ne prouve rien.
    - |
      if [ ! -f package-lock.json ]; then
        echo "package-lock.json est absent alors que l'installation se fait avec npm ci."
        exit 1
      fi
      for verrou in bun.lockb bun.lock yarn.lock pnpm-lock.yaml; do
        if [ -f "$verrou" ]; then
          echo "$verrou coexiste avec package-lock.json. Un seul gestionnaire, un seul verrou."
          exit 1
        fi
      done
      echo "Verrou unique : package-lock.json."

dependances-execution:
  stage: securite
  <<: *declencheurs
  needs: [installation]
  script:
    # Bloquant. Ce qui est listé ici part dans le navigateur du visiteur. Les
    # tolérances sont déclarées et datées dans le fichier d'exceptions, jamais
    # passées sous silence.
    - node .github/scripts/audit-dependencies.mjs

dependances-outillage:
  stage: securite
  <<: *declencheurs
  needs: [installation]
  # Informatif. Un défaut dans un outil de compilation ne part jamais chez le
  # visiteur : il est signalé, il ne bloque pas la fusion.
  allow_failure: true
  script:
    - npm audit --audit-level=high

secrets-historique:
  stage: securite
  <<: *declencheurs
  needs: []
  script:
    # Le dépôt vit sur deux plateformes. Un secret entré ici serait republié
    # deux fois, et le retirer d'un seul endroit ne le retirerait pas de
    # l'autre. Le contrôle lit tout l'historique, pas seulement l'arbre courant.
    - node scripts/audit-historique-secrets.mjs

fonctions-edge:
  stage: securite
  <<: *declencheurs
  needs: []
  image: denoland/deno:alpine-1.46.3
  script:
    - |
      for f in supabase/functions/*/index.ts; do
        echo "Vérification de $f"
        deno check "$f"
      done
    - deno check supabase/functions/_tests/*.ts
    - |
      deno test --allow-none \
        supabase/functions/_shared/ \
        supabase/functions/moderate-place/validate_test.ts \
        supabase/functions/register-partner/validate_test.ts \
        supabase/functions/submit-lead/lead_test.ts

# ---------------------------------------------------------------------------
# Recettes contre une vraie base
#
# Elles travaillent dans une transaction annulée : la base ressort intacte.
# Sans les variables de connexion, chaque recette s'ignore d'elle-même et le
# dit, plutôt que d'échouer et de faire passer une absence de configuration
# pour un défaut du produit.
# ---------------------------------------------------------------------------

.recette:
  stage: recettes
  <<: *declencheurs
  needs: [installation]
  # Ces recettes touchent la base de production en lecture et dans une
  # transaction annulée. Elles ne doivent jamais s'exécuter deux fois en
  # parallèle sur la même base.
  resource_group: base-akwaba

parcours-course:
  extends: .recette
  script:
    - node scripts/recette-parcours.mjs

gardes-argent:
  extends: .recette
  script:
    - node scripts/recette-gardes.mjs

comptes-entreprises:
  extends: .recette
  script:
    - node scripts/recette-organisations.mjs

parite-devis:
  extends: .recette
  script:
    - node scripts/parite-devis.mjs

identite-shopper:
  extends: .recette
  script:
    - node scripts/recette-identite.mjs

matrice-droits:
  extends: .recette
  script:
    - node scripts/recette-droits.mjs

canaux-notification:
  extends: .recette
  script:
    - node scripts/recette-canaux.mjs

avis-partenaires:
  extends: .recette
  script:
    - node scripts/recette-avis-partenaires.mjs

codes-promotionnels:
  extends: .recette
  script:
    - node scripts/recette-promo.mjs

financement-achats:
  extends: .recette
  script:
    - node scripts/recette-financement.mjs

demandes-reservation:
  extends: .recette
  script:
    - node scripts/recette-demandes-reservation.mjs

cloisonnement:
  extends: .recette
  script:
    - node scripts/recette-cloisonnement.mjs
